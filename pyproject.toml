[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-research"
version = "0.1.0"
description = "LLM-interpretability research: a citation-grounded theory KB, experimental arcs, and the NLA analysis/figure/audit pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Michael Lannum" }]

# Direct imports of the example scripts under examples/ (the nla_*, subliminal_*,
# emb_* and jspace_* families):
#   torch, numpy, matplotlib, datasets  -> declared here
#   llm_surgeon (.probe, surgery) -> the sibling toolkit, below
# torch is also pulled in transitively by llm-surgeon, but the render/analysis
# scripts that do NOT import llm_surgeon still need it, so it is declared
# directly. Install the sibling editable first: pip install -e ../llm-surgeon
#
# jlens (anthropics/jacobian-lens) is a SECOND sibling editable install, needed
# by every examples/jspace_*.py script. It is not on PyPI, so it cannot be
# listed below; install it the same way: pip install -e ../jacobian-lens
# Its absence is not caught until a script fails at `import jlens` — which on
# 2026-07-29 was at the start of a multi-hour GPU fit.
dependencies = [
    "llm-surgeon",
    "torch>=2.0",
    "numpy",
    "matplotlib",
    # examples/jspace_freeze_c4_corpus.py streams and freezes the arc-04 C4-en
    # corpus slice via `from datasets import load_dataset` (deferred import, so
    # its absence surfaces only when that script runs).
    "datasets",
]

[project.optional-dependencies]
# pip install -e '.[dev]' — needed to run examples/tests/.
dev = ["pytest"]

[tool.setuptools]
# This repo is a research workspace, not an importable package. The example
# scripts are run directly (python examples/<family>_*.py), so no package
# discovery.
py-modules = []

